<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chatbot Practice</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f2f4f8;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chatbot {
    width: 380px;
    height: 600px;
    background: white;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.header {
    background: #5b4bdb;
    color: white;
    padding: 18px;
    text-align: center;
}

.header h2 {
    font-size: 20px;
}

.header p {
    font-size: 12px;
    margin-top: 5px;
    opacity: 0.9;
}

.messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
}

.message {
    max-width: 80%;
    padding: 10px 13px;
    margin-bottom: 10px;
    border-radius: 12px;
    line-height: 1.4;
    font-size: 14px;
}

.bot {
    background: #eeeeff;
    color: #222;
    margin-right: auto;
}

.user {
    background: #5b4bdb;
    color: white;
    margin-left: auto;
}

.input-area {
    display: flex;
    padding: 12px;
    border-top: 1px solid #ddd;
    gap: 8px;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    outline: none;
}

.input-area button {
    border: none;
    background: #5b4bdb;
    color: white;
    padding: 0 18px;
    border-radius: 10px;
    cursor: pointer;
}

.input-area button:hover {
    background: #4638b8;
}
</style>
</head>

<body>

<div class="chatbot">

    <div class="header">
        <h2>🤖 AI Assistant</h2>
        <p>Online • Ready to help</p>
    </div>

    <div class="messages" id="messages">
        <div class="message bot">
            Hello! 👋 How can I help you today?
        </div>
    </div>

    <div class="input-area">
        <input 
            type="text" 
            id="userInput" 
            placeholder="Type your message..."
            onkeypress="handleKey(event)"
        >
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>

function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (message === "") return;

    addMessage(message, "user");

    input.value = "";

    setTimeout(function() {

        let reply = getBotReply(message);

        addMessage(reply, "bot");

    }, 500);
}


function addMessage(text, type) {

    const messages = document.getElementById("messages");

    const div = document.createElement("div");

    div.className = "message " + type;

    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;
}


function getBotReply(message) {

    message = message.toLowerCase();

    if (message.includes("hello") || message.includes("hi")) {
        return "Hello! 👋 Nice to meet you.";
    }

    if (message.includes("name")) {
        return "I'm your AI Assistant 🤖.";
    }

    if (message.includes("price")) {
        return "Please tell me which product or service you want the price for.";
    }

    if (message.includes("help")) {
        return "Sure! I can help answer your questions.";
    }

    if (message.includes("bye")) {
        return "Goodbye! 👋 Have a great day!";
    }

    return "Thanks for your message! I'm a demo chatbot. 🤖";
}


function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}

</script>

</body>
</html>
